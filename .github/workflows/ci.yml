# 持续集成：push 到 main 或 PR 时自动编译 + 全量测试
# 需在 GitHub 仓库设置中开启 main 分支保护（要求 CI 通过才能合并 PR）
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 集成测试使用 H2 内存库，无需启动 MySQL 服务
      - name: Build and test
        run: mvn -B verify
