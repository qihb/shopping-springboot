# 持续集成：push 到 main 或 PR 时自动编译 + 全量测试
# 需在 GitHub 仓库设置中开启 main 分支保护（要求 CI 通过才能合并 PR）
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 集成测试使用 H2 内存库，无需启动 MySQL 服务
      # 必须 clean：避免 Maven 缓存旧的模块 JAR 导致多模块类路径不一致
      # （例如 spring-shop-common ResultCode 新增枚举后缓存未刷新会引发 NoSuchFieldError）
      - name: Build and test
        run: mvn -B clean verify
