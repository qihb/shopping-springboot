server:
  port: 8080

spring:
  application:
    name: spring-shop
  # 默认激活 dev 环境，生产通过环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.springshop.**.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除配置：实体字段 isDeleted，1=已删除 0=未删除
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 接口文档（springdoc-openapi / Swagger UI）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
