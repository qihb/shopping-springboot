server:
  port: 8080

spring:
  application:
    name: spring-shop
  # 默认激活 dev 环境，生产通过环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  # 数据库迁移：启动时自动执行 classpath:db/migration 下未应用的脚本
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 兼容此前手动建表、尚无 flyway_schema_history 的本地库：
    # 发现非空库时以版本 0 为基线，随后仍会完整执行 V1~V{n}（脚本为 IF NOT EXISTS，可安全跳过已存在的表）
    baseline-on-migrate: true
    baseline-version: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.springshop.**.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除配置：实体字段 isDeleted，1=已删除 0=未删除
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 接口文档（springdoc-openapi / Swagger UI）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# JWT 配置（生产必须通过环境变量覆盖 secret）
jwt:
  # HS256 要求密钥至少 32 字节；示例值仅用于本地开发
  secret: ${JWT_SECRET:spring-shop-dev-secret-key-please-change-32bytes}
  # 过期时间（毫秒），默认 2 小时
  expiration: ${JWT_EXPIRATION:7200000}
