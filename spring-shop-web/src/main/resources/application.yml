server:
  # 6001 端口，避免与其他本地项目冲突
  port: 6001
  tomcat:
    # 上传超限时，Tomcat 必须先「吞掉」剩余请求体，才能把响应正常写回给客户端。
    # maxSwallowSize 默认只有 2MB，而这里的 max-request-size 是 10MB：
    # 一旦被拒绝的请求体超过 2MB，Tomcat 会直接断开连接，
    # 客户端只能看到 Broken pipe / chunked transfer encoding 之类的 I/O 错误，
    # GlobalExceptionHandler 里的「上传文件过大」提示**根本没有机会返回**（实测确认）。
    # 设为略大于 max-request-size，保证整个请求都能被吞掉、友好提示能正常送达。
    max-swallow-size: 12MB

spring:
  application:
    name: spring-shop
  # 默认激活 dev 环境，生产通过环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  # 文件上传上限：Excel 批量导入用。
  # 注意：仅靠下面两项不够 —— 还必须配合 server.tomcat.max-swallow-size，
  # 否则超限请求会被容器直接断连，GlobalExceptionHandler 的可读提示送不出去（见上）。
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  # Redis：登录失败锁定、token 黑名单等能力依赖；生产通过环境变量覆盖
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  # 数据库迁移：启动时自动执行 classpath:db/migration 下未应用的脚本
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 兼容此前手动建表、尚无 flyway_schema_history 的本地库：
    # 发现非空库时以版本 0 为基线，随后仍会完整执行 V1~V{n}（脚本为 IF NOT EXISTS，可安全跳过已存在的表）
    baseline-on-migrate: true
    baseline-version: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.springshop.**.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除配置：实体字段 isDeleted，1=已删除 0=未删除
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 接口文档（springdoc-openapi / Swagger UI）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# JWT 配置（生产必须通过环境变量覆盖 secret）
jwt:
  # HS256 要求密钥至少 32 字节；示例值仅用于本地开发
  secret: ${JWT_SECRET:spring-shop-dev-secret-key-please-change-32bytes}
  # 过期时间（毫秒），默认 2 小时
  expiration: ${JWT_EXPIRATION:7200000}

# 微信小程序（多端登录）：appid / secret 留空时走本地 mock（openid 由 code 确定性派生，无需外网）；
# 生产通过环境变量注入真实小程序凭证后，自动切换为调用微信 jscode2session 接口换取 openid
miniapp:
  appid: ${MINIAPP_APPID:}
  secret: ${MINIAPP_SECRET:}

# 管理后台：批量导入管理员时，「初始密码」列留空则使用该默认密码（生产建议用环境变量覆盖）
admin:
  import:
    default-password: ${ADMIN_IMPORT_DEFAULT_PASSWORD:123456}

# 订单超时自动取消：待付款订单超过该分钟数未支付，由定时任务自动取消并回滚库存
order:
  timeout:
    cancel-minutes: 30

# 加购未买召回圈人：每天凌晨 4 点圈出「加购了但没买」的人群与商品，本轮只圈人、不发券
stats:
  cart-recall:
    enabled: true
    # 每天 04:00；zone 必须显式指定 —— cron 使用 JVM 默认时区，容器通常为 UTC
    cron: "0 0 4 * * ?"
    zone: Asia/Shanghai
    # 召回窗口：加购满 24 小时仍未下单才算弃购；超过 7 天视为僵尸购物车，不再召回
    min-idle-hours: 24
    max-idle-days: 7
    # 防刷与长尾过滤
    min-quantity: 1
    max-cart-size: 200
    qty-cap: 5
    min-abandon-users: 3
    # 弃购率门槛：低于它的商品转化正常，用户没卡在价格上，发券撬不动
    min-abandon-rate: 0.70
    # 选品与回看窗口
    top-n: 100
    paid-window-days: 30
    # 跑批批大小
    page-size: 2000
    write-batch-size: 500
    # 建议券面额 = 加购金额 × 比例，并按上下限收敛（面额刻意做小，避免训练出「等券」行为）
    coupon-rate: 0.05
    min-coupon-amount: 5.00
    max-coupon-amount: 200.00
    retain-days: 90

# 可观测性：Actuator 仅暴露只读端点集合，env/beans 等敏感端点不对外；
# health 不展示明细，避免泄露内部组件信息（路径已在 SecurityConfig 中放行）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
